<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayNex – Crear Super Admins</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: #0f1c24;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 44px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }
    .card h1 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
    .card p  { font-size: 13px; color: #64748b; margin-bottom: 28px; }
    .admin-list { list-style: none; margin-bottom: 28px; display: flex; flex-direction: column; gap: 10px; }
    .admin-list li {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-list li .badge {
      background: #5b36f5;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    #logBox {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      font-size: 12.5px;
      color: #94a3b8;
      min-height: 120px;
      max-height: 260px;
      overflow-y: auto;
      margin-bottom: 24px;
      font-family: monospace;
      line-height: 1.7;
    }
    .log-ok   { color: #4ade80; }
    .log-warn { color: #fbbf24; }
    .log-err  { color: #f87171; }
    .btn-run {
      width: 100%;
      height: 50px;
      background: #5b36f5;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 12px;
    }
    .btn-run:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-run:not(:disabled):hover { background: #4824e0; }
    .btn-go {
      display: block;
      width: 100%;
      height: 46px;
      background: #00b87c;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      text-align: center;
      line-height: 46px;
    }
    .btn-go:hover { background: #009966; }
  </style>
</head>
<body>
<div class="card">
  <h1>🔐 Configurar Super Admins</h1>
  <p>Pulsa el botón para registrar los 3 Super Admins en Firebase Authentication y Firestore.</p>

  <ul class="admin-list">
    <li><span class="badge">SUPER ADMIN</span> gonzalezdaravinajostinjair@gmail.com</li>
    <li><span class="badge">SUPER ADMIN</span> samuelpaez0608@gmail.com</li>
    <li><span class="badge">SUPER ADMIN</span> san.18gutierrez@gmail.com</li>
  </ul>

  <div id="logBox"><span style="color:#475569;">— En espera de ejecución... —</span></div>

  <button class="btn-run" id="btnRun">▶ Crear Super Admins</button>
  <a href="login.html" class="btn-go" id="btnGo" style="display:none;">Ir al Login →</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    fetchSignInMethodsForEmail
  } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

  import { firebaseConfig } from "./firebase-confi.js";

  const app = initializeApp(firebaseConfig, "setup");
  const auth = getAuth(app);
  const db   = getFirestore(app);

  const SUPER_ADMINS = [
    { email: "gonzalezdaravinajostinjair@gmail.com", firstName: "Jostinjair",  lastName: "González Daravina" },
    { email: "samuelpaez0608@gmail.com",             firstName: "Samuel",       lastName: "Páez"              },
    { email: "san.18gutierrez@gmail.com",            firstName: "Gutierrez",    lastName: "San"               }
  ];
  const PASSWORD = "333435";

  const logBox = document.getElementById("logBox");
  const btnRun = document.getElementById("btnRun");
  const btnGo  = document.getElementById("btnGo");

  function log(msg, type = "") {
    const span = document.createElement("span");
    span.className = type ? `log-${type}` : "";
    span.textContent = msg;
    logBox.appendChild(span);
    logBox.appendChild(document.createElement("br"));
    logBox.scrollTop = logBox.scrollHeight;
  }

  async function saveToFirestore(uid, email, firstName, lastName) {
    await setDoc(doc(db, "users", uid), {
      uid,
      email,
      firstName,
      lastName,
      role: "superadmin",
      createdAt: serverTimestamp()
    }, { merge: true });
  }

  async function createAdmin({ email, firstName, lastName }) {
    log(`⏳ Procesando: ${email}`);
    try {
      // Intentar crear el usuario
      const cred = await createUserWithEmailAndPassword(auth, email, PASSWORD);
      const uid  = cred.user.uid;
      await saveToFirestore(uid, email, firstName, lastName);
      log(`✅ Creado exitosamente: ${email}`, "ok");
    } catch (err) {
      if (err.code === "auth/email-already-in-use") {
        log(`⚠️  Ya existe: ${email} – actualizando Firestore...`, "warn");
        try {
          // Iniciar sesión para obtener el UID
          const cred = await signInWithEmailAndPassword(auth, email, PASSWORD);
          const uid  = cred.user.uid;
          await saveToFirestore(uid, email, firstName, lastName);
          log(`✅ Firestore actualizado con rol superadmin: ${email}`, "ok");
        } catch (loginErr) {
          log(`❌ No se pudo actualizar ${email}: ${loginErr.message}`, "err");
        }
      } else {
        log(`❌ Error en ${email}: ${err.message}`, "err");
      }
    }
  }

  btnRun.addEventListener("click", async () => {
    btnRun.disabled = true;
    logBox.innerHTML = "";
    log("🚀 Iniciando creación de Super Admins...");
    log("─────────────────────────────────────────");

    for (const admin of SUPER_ADMINS) {
      await createAdmin(admin);
      log("─────────────────────────────────────────");
    }

    log("🏁 Proceso completado.", "ok");
    btnGo.style.display = "block";
  });
</script>
</body>
</html>
