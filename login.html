<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso y Registro - Empresa VR</title>
  <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .auth-card {
      max-width: 900px;
      border-radius: 12px;
      overflow: hidden;
    }
    .auth-bg-img {
      background: url('img/d55cc77d-427c-475a-bfd1-8a84c49639dc.png') center/cover no-repeat;
      min-height: 250px;
    }
    .nav-pills .nav-link.active {
      background-color: #212529;
    }
    .btn-dark {
      background-color: #212529;
    }
  </style>
</head>
<body class="bg-light">

  <section class="p-3 p-md-4 p-xl-5 min-vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
          <div class="card border-light-subtle shadow-lg auth-card">
            <div class="row g-0">
              
              <!-- Panel lateral decorativo / información -->
              <div class="col-12 col-md-5 bg-dark text-white p-4 p-md-5 d-flex flex-column justify-content-between">
                <div>
                  <div class="text-center mb-4">
                    <img src="img/d55cc77d-427c-475a-bfd1-8a84c49639dc.png" alt="Logo" class="img-fluid rounded-circle shadow" style="max-width: 110px;">
                  </div>
                  <h3 class="h4 text-center text-white mb-3">Plataforma VR</h3>
                  <p class="text-light text-center small">
                    Bienvenido a nuestra tienda y mercado interactivo. Inicia sesión para acceder a tu panel personalizado.
                  </p>
                </div>
                <div class="text-center mt-4">
                  <a href="Index.html" class="btn btn-outline-light btn-sm">← Volver al inicio</a>
                </div>
              </div>

              <!-- Formulario de autenticación -->
              <div class="col-12 col-md-7 bg-white p-4 p-md-5">
                
                <!-- Pestañas Iniciar Sesión / Registrarse -->
                <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-tab-pane" type="button" role="tab">Iniciar Sesión</button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-tab-pane" type="button" role="tab">Registrarse</button>
                  </li>
                </ul>

                <!-- Mensajes de Estado / Alerta -->
                <div id="alertMessage" class="alert d-none" role="alert"></div>

                <!-- Botón de Inicio con Google -->
                <div class="mb-4">
                  <button id="btnGoogleAuth" class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center py-2 shadow-sm">
                    <svg class="me-2" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.702 3.702 0 0 0 1.599-2.431H8v-3.08h7.545z" />
                    </svg>
                    <span>Continuar con Google</span>
                  </button>
                </div>

                <div class="position-relative text-center mb-4">
                  <hr class="text-secondary">
                  <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-secondary small">o con tu correo</span>
                </div>

                <div class="tab-content" id="authTabsContent">
                  
                  <!-- Formulario Iniciar Sesión -->
                  <div class="tab-pane fade show active" id="login-tab-pane" role="tabpanel">
                    <form id="loginForm">
                      <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="loginEmail" placeholder="correo@ejemplo.com" required>
                        <label for="loginEmail">Correo Electrónico</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
                        <label for="loginPassword">Contraseña</label>
                      </div>
                      <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg">Ingresar</button>
                      </div>
                    </form>
                  </div>

                  <!-- Formulario Registro -->
                  <div class="tab-pane fade" id="register-tab-pane" role="tabpanel">
                    <form id="registerForm">
                      <div class="row g-2 mb-3">
                        <div class="col-6">
                          <div class="form-floating">
                            <input type="text" class="form-control" id="regFirstName" placeholder="Nombre" required>
                            <label for="regFirstName">Nombre</label>
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="form-floating">
                            <input type="text" class="form-control" id="regLastName" placeholder="Apellido" required>
                            <label for="regLastName">Apellido</label>
                          </div>
                        </div>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="regEmail" placeholder="correo@ejemplo.com" required>
                        <label for="regEmail">Correo Electrónico</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="regPassword" placeholder="Contraseña" required minlength="6">
                        <label for="regPassword">Contraseña (min 6 caracteres)</label>
                      </div>
                      
                      <!-- Selector de Tipo de Usuario / Rol -->
                      <div class="mb-3">
                        <label for="regRole" class="form-label text-secondary small fw-bold">Tipo de Usuario:</label>
                        <select class="form-select py-2" id="regRole" required>
                          <option value="cliente" selected>🛒 Cliente (Quiero comprar productos)</option>
                          <option value="vendedor">🏪 Vendedor (Quiero vender mis productos)</option>
                        </select>
                      </div>

                      <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label text-secondary small" for="termsCheck">
                          Acepto los términos y condiciones de uso
                        </label>
                      </div>

                      <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg">Crear Cuenta</button>
                      </div>
                    </form>
                  </div>

                </div>

              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Script Bootstrap JS para activar pestañas -->
  <script src="https://unpkg.com/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Lógica Firebase Auth -->
  <script type="module">
    import { registerUser, loginUser, loginWithGoogle, checkAuthState } from "./auth.js";

    const alertMessage = document.getElementById("alertMessage");

    function showAlert(message, type = "danger") {
      alertMessage.className = `alert alert-${type} mb-3`;
      alertMessage.textContent = message;
      alertMessage.classList.remove("d-none");
    }

    function clearAlert() {
      alertMessage.classList.add("d-none");
    }

    // Verificar si ya hay una sesión activa
    checkAuthState((user, userData) => {
      if (user) {
        // Redirigir al dashboard si ya inició sesión
        window.location.href = "dashboard.html";
      }
    });

    // Evento Formulario Iniciar Sesión
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const result = await loginUser(email, password);
      if (result.success) {
        showAlert("¡Inicio de sesión exitoso! Redirigiendo...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } else {
        showAlert("Error al ingresar: " + (result.message || "Credenciales incorrectas"));
      }
    });

    // Evento Formulario Registro
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();
      const firstName = document.getElementById("regFirstName").value;
      const lastName = document.getElementById("regLastName").value;
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      const role = document.getElementById("regRole").value;

      const result = await registerUser(email, password, firstName, lastName, role);
      if (result.success) {
        showAlert(`¡Cuenta creada con éxito como ${result.role.toUpperCase()}! Redirigiendo...`, "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);
      } else {
        showAlert("Error al registrarse: " + result.message);
      }
    });

    // Evento Autenticación Google
    document.getElementById("btnGoogleAuth").addEventListener("click", async () => {
      clearAlert();
      // Si la pestaña active es de registro, usar el rol seleccionado, de lo contrario 'cliente' por defecto
      const isRegisterTab = document.getElementById("register-tab").classList.contains("active");
      const selectedRole = isRegisterTab ? document.getElementById("regRole").value : "cliente";

      const result = await loginWithGoogle(selectedRole);
      if (result.success) {
        showAlert("¡Autenticación con Google exitosa! Redirigiendo...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } else {
        showAlert("Error al autenticar con Google: " + result.message);
      }
    });
  </script>
</body>
</html>
